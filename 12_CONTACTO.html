  <script>
    document.getElementById('contact-form').addEventListener('submit', event => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      const subject = String(data.get('asunto') || 'Mensaje desde sebabraham.com');
      const body = `Nombre: ${data.get('nombre')}\nCorreo: ${data.get('correo')}\n\n${data.get('mensaje')}`;
      window.location.href = `mailto:sebastianabraham77@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    });
  </script>
