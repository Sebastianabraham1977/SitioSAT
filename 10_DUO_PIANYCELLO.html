<script id="mobile-menu-scroll-lock">
(()=>{
  const toggle=document.getElementById('menuToggle');
  const panel=document.querySelector('.menu-panel');
  const links=panel?.querySelector('.menu-links');
  if(!toggle||!panel||!links)return;
  const mobile=window.matchMedia('(max-width:700px)');
  const body=document.body;
  let savedY=0, savedStyles=null;
  const sync=()=>{
    if(!mobile.matches)return;
    if(toggle.checked&&!savedStyles){
      savedY=window.scrollY||window.pageYOffset||0;
      savedStyles={position:body.style.position,top:body.style.top,left:body.style.left,right:body.style.right,width:body.style.width,overflow:body.style.overflow};
      body.style.position='fixed';body.style.top=`-${savedY}px`;body.style.left='0';body.style.right='0';body.style.width='100%';body.style.overflow='hidden';
    }else if(!toggle.checked&&savedStyles){
      for(const [key,value] of Object.entries(savedStyles))body.style[key]=value;
      savedStyles=null;window.scrollTo(0,savedY);
    }
  };
  toggle.addEventListener('change',sync);
  document.addEventListener('click',()=>requestAnimationFrame(sync),true);
  panel.addEventListener('touchmove',event=>{if(!links.contains(event.target))event.preventDefault()},{passive:false});
  sync();
})();
</script>
