<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>Sebastián Abraham Teare · Músico</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#090909;color:#fff}
body{font-family:Arial,sans-serif;overflow:hidden}
#app{height:100%;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden}
#site-content{display:block;width:100%;height:100%;min-height:0;border:0;background:#090909}
#radio-dock{justify-self:end;width:min(390px,100%);margin-right:16px;padding:8px;border:1px solid rgba(255,255,255,.24);border-radius:16px 16px 0 0;background:#111;box-shadow:0 8px 28px rgba(0,0,0,.35)}
#radio-dock[hidden]{display:none}
#radio-header{height:30px;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin:0 0 5px;padding:0 3px}
#radio-title{font-size:12px;letter-spacing:.04em;color:#eee}
#radio-hide{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer}
#radio-link{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 12px;border:1px solid rgba(255,255,255,.24);border-radius:12px;background:#181818;color:#fff;text-decoration:none;font-size:14px}#radio-link:hover,#radio-link:focus-visible{border-color:#fff;outline:2px solid #fff;outline-offset:2px}
.radio-link-play{display:grid;width:34px;height:34px;flex:0 0 auto;place-items:center;border:1px solid #fff;border-radius:50%}.radio-link-play:after{content:"";width:0;height:0;margin-left:2px;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid #fff}.radio-link-arrow{margin-left:auto;font-size:18px}
@media(max-width:600px){#radio-dock{width:100%;margin-right:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-radius:14px 14px 0 0}}
</style>
</head>
<body>
<main id="app">
<iframe id="site-content" name="site-content" src="./01_PORTADA.html" title="Sitio de Sebastián Abraham"></iframe>
<section id="radio-dock" aria-label="Reproductor de radio" hidden>
<div id="radio-header"><span id="radio-title">Radio · Playlist de Sebastián Abraham</span><button id="radio-hide" type="button">Ocultar</button></div>
<a id="radio-link" href="https://open.spotify.com/playlist/0ieS2HGoiqeu5K5mWmn7L9" target="_blank" rel="noopener noreferrer"><span class="radio-link-play" aria-hidden="true"></span><span>Escuchar mi radio en Spotify</span><span class="radio-link-arrow" aria-hidden="true">↗</span></a>
</section>
</main>
<script>
(()=>{const site=document.getElementById('site-content'),dock=document.getElementById('radio-dock'),hide=document.getElementById('radio-hide');site.addEventListener('load',()=>{try{const doc=site.contentDocument;if(!doc)return;if(!doc.location.hash)site.contentWindow.scrollTo(0,0);doc.addEventListener('click',event=>{const link=event.target.closest?.('a[href]');if(!link||link.target==='_blank'||link.hasAttribute('download'))return;const destination=new URL(link.href,doc.location.href);if(destination.origin!==location.origin)return;event.preventDefault();event.stopImmediatePropagation();site.contentWindow.location.assign(destination.href)},true)}catch(error){}});window.addEventListener('message',event=>{if(event.source!==site.contentWindow||event.origin!==location.origin||event.data?.type!=='open-sebastian-radio')return;dock.hidden=false});hide.addEventListener('click',()=>{dock.hidden=true});})();
</script>
</body>
</html>
