<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>Sebastián Abraham Teare · Músico</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#090909;color:#fff}
body{font-family:Arial,sans-serif;overflow:hidden}
#app{height:100%;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden}
#site-content{display:block;width:100%;height:100%;min-height:0;border:0;background:#090909}
#radio-dock{background:#090909;border-top:1px solid rgba(255,255,255,.22);padding:7px 14px calc(7px + env(safe-area-inset-bottom));}
#radio-dock[hidden]{display:none}
#radio-header{height:32px;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:980px;margin:0 auto 5px}
#radio-title{font-size:13px;letter-spacing:.04em;color:#eee}
#radio-hide{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer}
#radio-player{display:block;width:min(100%,980px);height:152px;border:0;border-radius:12px;margin:0 auto;background:#121212}
@media(max-width:600px){#radio-dock{padding-left:8px;padding-right:8px}#radio-header{padding:0 4px}#radio-player{height:152px}}
</style>
</head>
<body>
<main id="app">
<iframe id="site-content" name="site-content" src="./01_PORTADA.html" title="Sitio de Sebastián Abraham"></iframe>
<section id="radio-dock" aria-label="Reproductor de radio" hidden>
<div id="radio-header"><span id="radio-title">Radio · Playlist de Sebastián Abraham</span><button id="radio-hide" type="button">Ocultar</button></div>
<iframe id="radio-player" title="Playlist de Sebastián Abraham en Spotify" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</section>
</main>
<script>
(()=>{const site=document.getElementById('site-content'),dock=document.getElementById('radio-dock'),player=document.getElementById('radio-player'),hide=document.getElementById('radio-hide');let loaded=false;window.addEventListener('message',event=>{if(event.source!==site.contentWindow||event.origin!==location.origin||event.data?.type!=='open-sebastian-radio')return;dock.hidden=false;if(!loaded){player.src='https://open.spotify.com/embed/playlist/0ieS2HGoiqeu5K5mWmn7L9?utm_source=generator&theme=0';loaded=true}});hide.addEventListener('click',()=>{dock.hidden=true});})();
</script>
</body>
</html>
