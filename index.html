<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>Sebastián Abraham Teare · Músico</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#090909;color:#fff}
body{font-family:Arial,sans-serif;overflow:hidden}
#app{height:100%;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden}
#site-content{display:block;width:100%;height:100%;min-height:0;border:0;background:#090909}
#radio-dock{justify-self:end;width:min(390px,100%);margin-right:16px;padding:7px 0;background:transparent}
#radio-dock[hidden]{display:none}
#radio-header{height:24px;display:flex;align-items:center;justify-content:flex-end;gap:12px;width:100%;margin:0 0 5px;padding:0 3px}
#radio-title{font-size:12px;letter-spacing:.04em;color:#d7c077}
#radio-hide{border:1px solid rgba(215,192,119,.65);background:rgba(26,22,13,.9);color:#e7d18c;border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer}
#radio-link{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 16px;border:1px solid #c9ad64;border-radius:999px;background:rgba(34,29,17,.94);color:#f6f3e9;text-decoration:none;font-size:15px;font-weight:600;box-shadow:0 0 18px rgba(201,173,100,.12);transition:background .18s ease,border-color .18s ease}
#radio-link:hover,#radio-link:focus-visible{border-color:#f0d47c;background:#302817;outline:2px solid #e3c66f;outline-offset:2px}
.radio-link-play{display:grid;width:34px;height:34px;flex:0 0 auto;place-items:center;border:1px solid #d4bc70;border-radius:50%}.radio-link-play:after{content:"";width:0;height:0;margin-left:2px;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid #d4bc70}.radio-link-brand{margin-left:auto;color:#d4bc70;font-size:12px;font-weight:700;letter-spacing:.07em}
@media(max-width:600px){#radio-dock{width:100%;margin-right:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(9,9,9,.94) 28%)}#radio-link{min-height:54px;font-size:14px}}
</style>
</head>
<body>
<main id="app">
<iframe id="site-content" name="site-content" src="./01_PORTADA.html" title="Sitio de Sebastián Abraham"></iframe>
<section id="radio-dock" aria-label="Reproductor de radio" hidden>
<div id="radio-header"><span id="radio-title">Radio de Sebastián Abraham</span><button id="radio-hide" type="button">Ocultar</button></div>
<a id="radio-link" href="https://open.spotify.com/playlist/0ieS2HGoiqeu5K5mWmn7L9" target="_blank" rel="noopener noreferrer"><span class="radio-link-play" aria-hidden="true"></span><span>Oír radio Sebastián Abraham</span><span class="radio-link-brand">SPOTIFY</span></a>
</section>
</main>
<script>
(()=>{const site=document.getElementById('site-content'),dock=document.getElementById('radio-dock'),hide=document.getElementById('radio-hide');site.addEventListener('load',()=>{try{const doc=site.contentDocument;if(!doc)return;if(doc.location.pathname.endsWith('/01_PORTADA.html'))dock.hidden=false;if(!doc.location.hash)site.contentWindow.scrollTo(0,0);doc.addEventListener('click',event=>{const link=event.target.closest?.('a[href]');if(!link||link.target==='_blank'||link.hasAttribute('download'))return;const destination=new URL(link.href,doc.location.href);if(destination.origin!==location.origin)return;event.preventDefault();event.stopImmediatePropagation();site.contentWindow.location.assign(destination.href)},true)}catch(error){}});window.addEventListener('message',event=>{if(event.source!==site.contentWindow||event.origin!==location.origin||event.data?.type!=='open-sebastian-radio')return;dock.hidden=false});hide.addEventListener('click',()=>{dock.hidden=true});})();
</script>
</body>
</html>
