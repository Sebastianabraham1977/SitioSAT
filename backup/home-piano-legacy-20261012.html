<style>

<script>
(()=>{
 const stage=document.getElementById('homePianoStage');
 if(!stage)return;
 const layer=stage.querySelector('.home-piano-key-links'),svg=stage.querySelector('.home-piano-arrows'),keyboard=stage.querySelector('.home-piano-key-player'),prompts=[...stage.querySelectorAll('.piano-prompt')];
 const notes=[60,62,64,65,67,69,71,72,74,76,77,79,81,83];
 const desktopKeySlots={lessons:5,live:8,sing:7,video:3};
  const positions=[{left:'2%',top:'3px'},{right:'1%',top:'5px'},{left:'9%',bottom:'6px'},{right:'7%',bottom:'0'}];
 const byDestination={lessons:'./06_CLASES_DE_PIANO.html',live:'./04_BANDAS.html',sing:'./03_CANCIONERO.html#cancionero',video:'./05_MUSICA_AUDIOVISUAL.html'};
 const chosen=[65,77,72,69];
 svg.addEventListener('click',event=>{const hit=event.target.closest?.('.piano-point-hit');if(!hit)return;event.preventDefault();window.location.assign(byDestination[hit.dataset.destination])});
 prompts.forEach((prompt,i)=>{
  Object.assign(prompt.style,positions[i]);
  const note=chosen[i],key=document.createElement('a');
  prompt.dataset.note=String(note);key.className='home-piano-key-link';key.href=byDestination[prompt.dataset.destination];key.dataset.note=String(note);key.setAttribute('aria-label',`Abrir sección: ${prompt.textContent.trim()}`);
  layer.appendChild(key);
 });
 const alignKeys=()=>{
  const pianoRect=keyboard.getBoundingClientRect(),windowRect=keyboard.parentElement.getBoundingClientRect(),layerRect=layer.getBoundingClientRect();if(!pianoRect.width||!windowRect.width||!layerRect.width)return;
  const desktop=window.matchMedia('(min-width: 641px)').matches,keyCount=14;
  /* The mobile iframe is scaled and cropped; these ratios match the actual 14 white-key bed inside Piano Aura. */
  const keySpanWidth=desktop?windowRect.width*.853:pianoRect.width*.814,whiteKeyWidth=keySpanWidth/keyCount;
  const origin=desktop?windowRect.left+(windowRect.width-keySpanWidth)/2:pianoRect.left+pianoRect.width*.12;
  const rawKeyTop=windowRect.top-(desktop?54.5:46.5),rawKeyBottom=rawKeyTop+(desktop?224:192),visibleKeyTop=Math.max(windowRect.top,rawKeyTop),visibleKeyBottom=Math.min(windowRect.bottom,rawKeyBottom),targetY=desktop?(visibleKeyTop+visibleKeyBottom)/2:visibleKeyTop+(visibleKeyBottom-visibleKeyTop)*.58;
  prompts.forEach(prompt=>{const key=layer.querySelector(`.home-piano-key-link[data-note="${prompt.dataset.note}"]`),index=notes.indexOf(+prompt.dataset.note);if(!key||index<0)return;const keyIndex=index,left=origin+keyIndex*whiteKeyWidth,hotspot=Math.min(whiteKeyWidth*.9,44),hotspotHeight=44,targetX=left+whiteKeyWidth/2;key.style.left=`${(targetX-hotspot/2-layerRect.left)/layerRect.width*100}%`;key.style.width=`${hotspot/layerRect.width*100}%`;key.style.top=`${targetY-hotspotHeight/2-layerRect.top}px`;key.style.bottom='auto';key.style.height=`${hotspotHeight}px`});
  if(desktop){const prompt=stage.querySelector('.piano-prompt-sing'),key=layer.querySelector(`[data-note="${prompt.dataset.note}"]`),keyRect=key.getBoundingClientRect(),stageRect=stage.getBoundingClientRect();prompt.style.left=`${keyRect.left+keyRect.width/2-stageRect.left-prompt.offsetWidth/2}px`;prompt.style.right='auto'}
 };
 const draw=()=>{
  const frame=stage.getBoundingClientRect(),defs=svg.querySelector('defs');svg.setAttribute('viewBox',`0 0 ${stage.clientWidth} ${stage.clientHeight}`);svg.replaceChildren(defs);defs.replaceChildren();
  prompts.forEach(prompt=>{
   const key=layer.querySelector(`[data-note="${prompt.dataset.note}"]`);if(!key)return;
   const a=prompt.getBoundingClientRect(),b=key.getBoundingClientRect(),above=a.bottom<frame.top+stage.clientHeight/2;
   const x1=a.left-frame.left+a.width/2,y1=(above?a.bottom:a.top)-frame.top,x2=b.left-frame.left+b.width/2,y2=b.top-frame.top+b.height/2;
   const color=getComputedStyle(prompt).color,path=document.createElementNS('http://www.w3.org/2000/svg','path');
   const desktop=window.matchMedia('(min-width: 641px)').matches;
   const purpleTurn=desktop&&prompt.dataset.destination==='video';
   const wideTurn=['lessons','video'].includes(prompt.dataset.destination),distance=purpleTurn?Math.max(104,b.height*1.45):Math.max(wideTurn?58:28,b.height*(wideTurn?1.08:.82));
   const trackY=above?y2-distance:y2+distance;
   const mobileYellow=!desktop&&prompt.dataset.destination==='lessons';
   const route=desktop&&prompt.dataset.destination==='sing'?`M${x2},${y2} V${y1}`:mobileYellow?`M${x2},${y1} V${y2}`:purpleTurn?`M${x1},${y1} V${trackY} C${x1},${trackY-44} ${x2},${trackY-44} ${x2},${y2}`:`M${x1},${y1} V${trackY} H${x2} V${y2}`;
   path.setAttribute('d',route);path.setAttribute('stroke',color);svg.appendChild(path);const hitLink=document.createElementNS('http://www.w3.org/2000/svg','a');hitLink.setAttribute('href',byDestination[prompt.dataset.destination]);hitLink.setAttribute('aria-label',`Abrir sección: ${prompt.textContent.trim()}`);const hit=document.createElementNS('http://www.w3.org/2000/svg','circle');hit.setAttribute('class','piano-point-hit');hit.setAttribute('cx',x2);hit.setAttribute('cy',y2);hit.setAttribute('r','26');hit.setAttribute('fill','transparent');hit.setAttribute('pointer-events','all');hit.dataset.destination=prompt.dataset.destination;hitLink.appendChild(hit);svg.appendChild(hitLink);
   const point=document.createElementNS('http://www.w3.org/2000/svg','circle');point.setAttribute('cx',x2);point.setAttribute('cy',y2);point.setAttribute('r','5');point.setAttribute('pointer-events','none');point.setAttribute('fill',color);point.setAttribute('stroke','#fff');point.setAttribute('stroke-width','1.5');svg.appendChild(point);
  });
 };
 const layout=()=>{alignKeys();draw()};requestAnimationFrame(layout);keyboard.addEventListener('load',()=>requestAnimationFrame(layout));window.addEventListener('resize',()=>requestAnimationFrame(layout));if('ResizeObserver'in window)new ResizeObserver(()=>requestAnimationFrame(layout)).observe(stage);
})();
</script>
